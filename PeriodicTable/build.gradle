plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'com.frozendevs.periodictable'
    compileSdk 35

    defaultConfig {
        applicationId "com.frozendevs.periodictable"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "1.0"

        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'GoogleAppIndexingWarning', 'UnusedAttribute'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.collection:collection:1.4.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    implementation 'com.squareup.picasso:picasso:2.8'
}

if (project.hasProperty("PeriodicTable.signing") &&
        file(project.property("PeriodicTable.signing") + ".gradle").exists()) {
    apply from: project.property("PeriodicTable.signing") + ".gradle";
}
