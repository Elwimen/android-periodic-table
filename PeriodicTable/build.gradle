plugins {
    id 'com.android.application' version '9.4.1'
}

// Release signing is driven by a gitignored keystore.properties at the repo
// root. When it is absent (e.g. a clean checkout) the release build is simply
// left unsigned instead of failing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Build-time version name: <UTC build date>-<git short hash>, with a "-dirty"
// marker when the working tree has uncommitted changes, so the hash always
// matches what was actually built. Falls back to the date alone outside git.
def cmdOut = { List<String> args ->
    try {
        def out = providers.exec {
            commandLine args
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return out
    } catch (Exception ignored) {
        return ""
    }
}
def gitHash = cmdOut(["git", "rev-parse", "--short", "HEAD"])
def gitDirty = cmdOut(["git", "status", "--porcelain"]).isEmpty() ? "" : "-dirty"
def buildDate = new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
def dynVersionName = gitHash.isEmpty() ? buildDate : "${buildDate}-${gitHash}${gitDirty}"

android {
    namespace 'com.frozendevs.periodictable'
    compileSdk 35

    defaultConfig {
        applicationId "com.frozendevs.periodictable"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName dynVersionName

        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Keep R8 / resource shrinking off: the app parses its database via
            // Gson reflection, so shrinking risks stripping model fields.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'GoogleAppIndexingWarning', 'UnusedAttribute'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.collection:collection:1.4.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    implementation 'com.squareup.picasso:picasso:2.8'
}
