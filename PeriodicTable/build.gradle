plugins {
    id 'com.android.application' version '9.4.1'
}

// Release signing is driven by a gitignored keystore.properties at the repo
// root. When it is absent (e.g. a clean checkout) the release build is simply
// left unsigned instead of failing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.frozendevs.periodictable'
    compileSdk 35

    defaultConfig {
        applicationId "com.frozendevs.periodictable"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.1"

        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Keep R8 / resource shrinking off: the app parses its database via
            // Gson reflection, so shrinking risks stripping model fields.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        disable 'GoogleAppIndexingWarning', 'UnusedAttribute'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.collection:collection:1.4.5'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    implementation 'com.squareup.picasso:picasso:2.8'
}
